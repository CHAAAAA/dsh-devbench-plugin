name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and pack (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.9.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, validate messages, build, and test
        run: npm run check

      - name: Pack release tarball
        run: npm run release:pack -- --skip-build

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: dsh-devbench-plugin-tarball-node-${{ matrix.node }}
          path: |
            dist/release/*.tgz
            dist/release/manifest.json
          if-no-files-found: error
